<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta -->
    <title>JobPortal - Global AI Recruitment & PDF Resume Parsing Platform</title>
    <meta name="description" content="Find full-time jobs, part-time gigs, remote work, and internships worldwide. Upload your PDF resume for instant AI parsing and smart job matching across 120+ global cities." />
    <meta name="keywords" content="job portal, AI hiring, resume parser, remote jobs, part-time jobs, full-time jobs, direct recruitment, global jobs, career blog, job search tips" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="JobPortal Team" />

    <!-- Canonical URL - Replace with your actual domain -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="JobPortal - Global AI Recruitment & Resume Parsing Platform" />
    <meta property="og:description" content="Connect directly with top employers worldwide. AI-powered PDF resume parsing, instant job matching, and flexible gig hiring across 120+ cities." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:site_name" content="JobPortal" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JobPortal - Global AI Recruitment Platform" />
    <meta name="twitter:description" content="AI-powered job matching & resume parsing. Find full-time, part-time, and remote jobs globally." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!--
      ====================================================
      GOOGLE ADSENSE SETUP INSTRUCTIONS
      ====================================================
      After your AdSense application is APPROVED:

      1. Replace YOUR_ADSENSE_PUBLISHER_ID below with your
         actual Publisher ID (format: ca-pub-XXXXXXXXXX)

      2. Uncomment the script tag below:

      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID"
           crossorigin="anonymous"></script>

      3. In src/components/AdBanner.jsx, update AD_CONFIG.client

      4. Run npm run build and redeploy to production.
      ====================================================

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
